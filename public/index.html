<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easy Finance Guide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="glass-card">
      <h1>Ask EFG AI</h1>
      <p class="subtitle">Get instant answers to finance questions</p>

      <div class="input-row">
        <input
          type="text"
          id="question"
          placeholder="e.g. What is the difference between stocks and bonds?"
        />
        <button id="askBtn">Ask AI</button>
      </div>

      <div id="answer" class="answer-box"></div>
    </section>

    <section class="categories">
      <div class="cat">📈 Trading Basics</div>
      <div class="cat">📊 Securities</div>
      <div class="cat">💰 Student Budgeting</div>
      <div class="cat">🚀 Grow Your Money</div>
    </section>

    <footer>
      Powered by Google Gemini AI<br />
      EFG © 2026
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
